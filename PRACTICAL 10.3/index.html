<!DOCTYPE html>
<html>

<head>
    <title>Student Details - Runtime Input</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h2 {
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: inline-block;
            width: 110px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"] {
            padding: 5px;
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 7px 15px;
            margin-right: 10px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button#clearBtn {
            background-color: #e74c3c;
        }

        table {
            width: 70%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h2>Student Details - Runtime Input</h2>

    <!-- Input Form -->
    <div class="form-group">
        <label>ID:</label>
        <input type="number" id="studentId" placeholder="Enter ID" />
    </div>
    <div class="form-group">
        <label>Name:</label>
        <input type="text" id="studentName" placeholder="Enter Name" />
    </div>
    <div class="form-group">
        <label>Department:</label>
        <input type="text" id="studentDept" placeholder="Enter Department" />
    </div>
    <div class="form-group">
        <label>Marks:</label>
        <input type="number" id="studentMarks" placeholder="Enter Marks" />
    </div>

    <br>
    <button onclick="addStudent()">Add Student</button>
    <button id="clearBtn" onclick="clearTable()">Clear Table</button>

    <!-- Output Table -->
    <table id="studentTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
        function addStudent() {
            const id    = document.getElementById("studentId").value.trim();
            const name  = document.getElementById("studentName").value.trim();
            const dept  = document.getElementById("studentDept").value.trim();
            const marks = document.getElementById("studentMarks").value.trim();

            // Validate inputs
            if (!id || !name || !dept || !marks) {
                alert("Please fill in all fields before adding a student.");
                return;
            }

            const tableBody = document.querySelector("#studentTable tbody");

            const row = document.createElement("tr");

            [id, name, dept, marks].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            tableBody.appendChild(row);

            // Clear input fields after adding
            document.getElementById("studentId").value = "";
            document.getElementById("studentName").value = "";
            document.getElementById("studentDept").value = "";
            document.getElementById("studentMarks").value = "";
        }

        function clearTable() {
            const tableBody = document.querySelector("#studentTable tbody");
            tableBody.replaceChildren();
        }
    </script>

</body>

</html>
